<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="EcoLife - Turn eco-friendly actions into daily habits. Track your green score, grow your impact tree, and join a global community forest.">
    <meta name="theme-color" content="#00FF88">
    <title>EcoLife - Gamified Sustainability</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js (UMD) -->
    <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/index.css?v=4">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/landing.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/missions.css">
    <link rel="stylesheet" href="css/tree.css">
    <link rel="stylesheet" href="css/recycling.css">
    <link rel="stylesheet" href="css/community.css">
    <link rel="stylesheet" href="css/calculator.css">
</head>

<body>
    <!-- Loading screen - outside #app so view renders don't remove it -->
    <div class="app-loader" id="appLoader">
        <div class="loader-content">
            <svg class="loader-leaf" viewBox="0 0 48 48" width="64" height="64">
                <path d="M24 4C24 4 8 16 8 28C8 36.837 15.163 44 24 44C32.837 44 40 36.837 40 28C40 16 24 4 24 4Z"
                    fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" />
                <path d="M24 44V20" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" />
                <path d="M24 28C18 22 16 18 16 18" fill="none" stroke="#00FF88" stroke-width="1.5"
                    stroke-linecap="round" />
                <path d="M24 24C30 18 32 14 32 14" fill="none" stroke="#00FF88" stroke-width="1.5"
                    stroke-linecap="round" />
            </svg>
            <div class="loader-bar">
                <div class="loader-bar-fill"></div>
            </div>
            <p class="loader-text">Growing your experience...</p>
        </div>
    </div>

    <!-- App Mount Point -->
    <div id="app"></div>

    <!-- Runtime config: set window.ECOLIFE_CONFIG.geminiApiKey in js/config.js for deployment. -->
    <script src="js/config.js"></script>

    <!-- App Entry (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
